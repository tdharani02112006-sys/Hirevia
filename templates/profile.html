<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hirevia - Create Profile</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .profile-container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .profile-container h1 {
            color: #1769e0;
            margin-bottom: 8px;
        }

        .profile-container p {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1769e0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #0f55bd;
        }
    </style>
</head>

<body>

    <div class="profile-container">

        <h1>Create Your Profile</h1>
        <p>Complete your profile to find suitable jobs and internships.</p>

        <form method="POST" action="/profile">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="e.g. Chennai" required>
            </div>

            <div class="form-group">
                <label>Education</label>
                <input type="text" name="education" placeholder="e.g. B.Sc Computer Science" required>
            </div>

            <div class="form-group">
                <label>Skills</label>
                <input type="text" name="skills" placeholder="e.g. Python, SQL, HTML, CSS">
            </div>

            <div class="form-group">
                <label>Experience</label>
                <select name="experience">
                    <option value="">Select experience</option>
                    <option value="Fresher">Fresher</option>
                    <option value="0-1 Years">0-1 Years</option>
                    <option value="1-2 Years">1-2 Years</option>
                    <option value="2+ Years">2+ Years</option>
                </select>
            </div>

            <div class="form-group">
                <label>About Me</label>
                <textarea name="about" placeholder="Write a short description about yourself"></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Create Profile
            </button>

        </form>

    </div>

</body>
</html>
